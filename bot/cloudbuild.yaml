# Cloud Build builds the image when you deploy from a Mac, which is arm64 while Cloud Run
# is amd64. The GitHub Actions deploy does not use this: its runner is already amd64, so it
# builds and pushes directly (.github/workflows/deploy-bot.yml).
#   gcloud builds submit --config bot/cloudbuild.yaml --substitutions=_IMAGE=<image> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "bot/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
