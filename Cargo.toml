[package]
name = "polygo"
version = "0.1.0"
edition = "2024"
description = "Lokalise for one person: a local-first, git-native localization CLI"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
