[package]
name = "polygo"
version = "0.1.0"
edition = "2024"
description = "Lokalise for one person: a local-first, git-native localization CLI"
license = "MIT"

[lib]
name = "polygo"
path = "src/lib.rs"

[[bin]]
name = "polygo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
