name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Binary size budget (< 15 MB)
        shell: bash
        run: |
          cargo build --release
          f=target/release/polygo; [ -f "$f.exe" ] && f="$f.exe"
          size=$(wc -c < "$f"); echo "release binary: $size bytes"
          [ "$size" -lt 15728640 ]
