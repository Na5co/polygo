name: polygo
description: "Check localization files for broken placeholders and missing plural forms (mode: check), or translate new strings and open a pull request (mode: translate)."
branding:
  icon: globe
  color: blue
inputs:
  mode:
    description: '"check" validates existing translations and fails the job on errors (no model, no secrets); "translate" runs polygo translate and opens a PR'
    default: translate
  path:
    description: "mode: check only. A string file or directory to check without polygo.toml (format and locales detected). Empty: the configured project."
    default: ""
  strict:
    description: "mode: check only. Warnings (length, identical) fail the job too."
    default: "false"
  version:
    description: polygo release to install (tag), or "latest"
    default: latest
  locales:
    description: Comma-separated locales to translate (default: all targets in polygo.toml)
    default: ""
  args:
    description: Extra arguments for `polygo translate` (e.g. --no-context)
    default: ""
  pr:
    description: Open a pull request with the changes (true) or just commit to the current branch (false)
    default: "true"
  branch:
    description: Branch name for the pull request
    default: polygo/translations
  token:
    description: Token used to create the pull request
    default: ${{ github.token }}
outputs:
  changed:
    description: "translate: true when translations changed"
    value: ${{ steps.run.outputs.changed }}
  coverage:
    description: "translate: Markdown coverage table (polygo status --markdown)"
    value: ${{ steps.run.outputs.coverage }}
  errors:
    description: "check: number of errors"
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: "check: number of warnings"
    value: ${{ steps.check.outputs.warnings }}
runs:
  using: composite
  steps:
    - name: Install polygo
      shell: bash
      run: |
        set -euo pipefail
        v="${{ inputs.version }}"
        if [ "$v" = "latest" ]; then
          v=$(curl -fsSL https://api.github.com/repos/Na5co/polygo/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
        fi
        os=$(uname -s | tr '[:upper:]' '[:lower:]'); arch=$(uname -m)
        case "$arch" in x86_64) arch=x86_64;; aarch64|arm64) arch=aarch64;; esac
        url="https://github.com/Na5co/polygo/releases/download/${v}/polygo-${v}-${arch}-${os}.tar.gz"
        mkdir -p "$RUNNER_TEMP/polygo" && curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/polygo"
        echo "$RUNNER_TEMP/polygo" >> "$GITHUB_PATH"
    - name: Check
      id: check
      if: ${{ inputs.mode == 'check' }}
      shell: bash
      env:
        POLYGO_PATH: ${{ inputs.path }}
        POLYGO_LOCALES: ${{ inputs.locales }}
        POLYGO_STRICT: ${{ inputs.strict == 'true' && '1' || '0' }}
      run: bash "${{ github.action_path }}/check.sh"
    - name: Translate
      id: run
      if: ${{ inputs.mode != 'check' }}
      shell: bash
      env:
        POLYGO_LOCALES: ${{ inputs.locales }}
        POLYGO_ARGS: ${{ inputs.args }}
        DRY_RUN: ${{ inputs.pr == 'true' && '1' || '0' }}
      run: bash "${{ github.action_path }}/run.sh"
    - name: Open pull request
      if: ${{ inputs.mode != 'check' && inputs.pr == 'true' && steps.run.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
        title: "chore(i18n): update translations"
        commit-message: "chore(i18n): update translations with polygo"
        body: |
          Translations updated by [polygo](https://github.com/Na5co/polygo).
          Review with `polygo review`, or edit the files directly: hand edits are never overwritten.

          ${{ steps.run.outputs.coverage }}
        labels: i18n
