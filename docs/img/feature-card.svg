<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="polygo-bot: reviews translations on every pull request">
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0969da"/>

  <!-- The mark, the same one as the avatar, at a size that reads on a card. -->
  <g transform="translate(96,150) scale(0.62)">
    <rect width="512" height="512" rx="112" fill="#0969da"/>
    <line x1="256" y1="150" x2="256" y2="96" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="256" cy="80" r="21" fill="#ffffff"/>
    <path d="M104 150 h304 a46 46 0 0 1 46 46 v168 a46 46 0 0 1 -46 46 h-186 l-76 62 v-62 h-42 a46 46 0 0 1 -46 -46 v-168 a46 46 0 0 1 46 -46 z" fill="#ffffff"/>
    <g fill="none" stroke="#0969da" stroke-linecap="round">
      <circle cx="246" cy="280" r="92" stroke-width="15"/>
      <ellipse cx="246" cy="280" rx="38" ry="92" stroke-width="12"/>
      <line x1="154" y1="280" x2="338" y2="280" stroke-width="12"/>
    </g>
    <rect x="330" y="330" width="134" height="134" rx="36" fill="#8250df" stroke="#0969da" stroke-width="16"/>
    <path d="M362 396 l22 22 l41 -45" fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="460" y="232" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5">polygo-bot</text>
  <text x="460" y="296" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="30">Reviews the translations in every pull request.</text>

  <!-- What it says, as it says it. -->
  <rect x="460" y="340" width="724" height="164" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="488" y="382" fill="#f85149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21">locales/it.json:3</text>
  <text x="488" y="420" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21">placeholder name translated: {{user}} → {{utente}}</text>
  <text x="488" y="462" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21">+ "greeting": "Bentornato, {{user}}!"</text>
  <text x="1156" y="462" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="19" text-anchor="end">one click</text>

  <text x="460" y="552" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="24">.xcstrings · strings.xml · .arb · i18next · .po · .resx · .strings</text>
  <text x="460" y="590" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="22">Milliseconds. No model. Nothing stored.</text>
</svg>
