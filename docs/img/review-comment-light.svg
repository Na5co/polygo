<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="the review on a pull request">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="40" y="40" width="1200" height="640" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
  <path d="M40 52 a12 12 0 0 1 12 -12 h1176 a12 12 0 0 1 12 12 v28 h-1200 z" fill="#f6f8fa"/>
  <circle cx="62" cy="60" r="6" fill="#ff5f57"/>
  <circle cx="82" cy="60" r="6" fill="#febc2e"/>
  <circle cx="102" cy="60" r="6" fill="#28c840"/>
  <text x="640.0" y="65" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13">Files changed · locales/es.json</text>
  
  <text x="76" y="105" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600">locales/es.json</text>
  <rect x="72" y="120" width="1136" height="96" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="88.0" y="150" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">2</text>
<text x="97.0" y="150" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">    </text>
<text x="133.1" y="150" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">  "greeting": "¡Bienvenido de nuevo, </text>
<text x="466.6" y="150" fill="#f85149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">{{usuario}}</text>
<text x="565.8" y="150" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">!",</text>
  <text x="88.0" y="180" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">3</text>
<text x="97.0" y="180" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">    </text>
<text x="133.1" y="180" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">  "notes.count": "Tienes {{count}} notas",</text>

  <rect x="72" y="240" width="1136" height="410" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <g transform="translate(96,262) scale(0.055)">
  <!-- The reviewer's avatar: a speech bubble (language) holding the wordmark's globe (many
       languages), an antenna (it is a bot) and the wordmark's check (what it comes to give).
       Shapes only — no fonts, nothing external — so it rasterises anywhere. -->
  <rect width="512" height="512" rx="112" fill="#0969da"/>

  <!-- Antenna. -->
  <line x1="256" y1="150" x2="256" y2="96" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="80" r="21" fill="#ffffff"/>

  <!-- The bubble, with its tail on the left so the badge has the right corner to itself. -->
  <path d="M104 150 h304 a46 46 0 0 1 46 46 v168 a46 46 0 0 1 -46 46 h-186 l-76 62 v-62 h-42 a46 46 0 0 1 -46 -46 v-168 a46 46 0 0 1 46 -46 z" fill="#ffffff"/>

  <!-- The globe inside it. -->
  <g fill="none" stroke="#0969da" stroke-linecap="round">
    <circle cx="246" cy="280" r="92" stroke-width="15"/>
    <ellipse cx="246" cy="280" rx="38" ry="92" stroke-width="12"/>
    <line x1="154" y1="280" x2="338" y2="280" stroke-width="12"/>
  </g>

  <!-- The check, as a badge on the bubble's corner. -->
  <rect x="330" y="330" width="134" height="134" rx="36" fill="#8250df" stroke="#0969da" stroke-width="16"/>
  <path d="M362 396 l22 22 l41 -45" fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
</g>
  <text x="140" y="288" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">polygolint</text>
  <rect x="216" y="273" width="34" height="19" rx="9" fill="none" stroke="#d1d9e0"/>
  <text x="233" y="287" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12">bot</text>
  <text x="264" y="288" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15">commented 2 seconds ago</text>

  <circle cx="105" cy="330" r="10" fill="#f85149"/>
  <path d="M100 325 l10 10 M110 325 l-10 10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="126" y="336" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="17"><tspan font-weight="700">Placeholder mismatch</tspan> · <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#0969da">greeting</tspan> <tspan fill="#59636e">[es]</tspan></text>
  <text x="96" y="370" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="16">placeholder name translated: {{user}} → {{usuario}} (names must stay as in the source)</text>

  <rect x="96" y="398" width="1088" height="150" rx="8" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="112" y="424" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13">Suggested change</text>
  <rect x="97" y="436" width="1086" height="30" fill="#ffebe9"/>
  <text x="112.0" y="456" fill="#f85149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">-</text>
<text x="121.0" y="456" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">   "greeting": "¡Bienvenido de nuevo, </text>
<text x="463.6" y="456" fill="#f85149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">{{usuario}}</text>
<text x="562.8" y="456" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">!",</text>
  <rect x="97" y="466" width="1086" height="30" fill="#dafbe1"/>
  <text x="112.0" y="486" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">+</text>
<text x="121.0" y="486" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">   "greeting": "¡Bienvenido de nuevo, </text>
<text x="463.6" y="486" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">{{user}}</text>
<text x="535.7" y="486" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" xml:space="preserve">!",</text>
  <rect x="112" y="508" width="176" height="30" rx="6" fill="#238636"/>
  <text x="200" y="528" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">Apply suggestion</text>
  <rect x="300" y="508" width="200" height="30" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="400" y="528" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14">Add suggestion to batch</text>

  <text x="96" y="600" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15">Where the repair is mechanical, the fix is one click — the name goes back to the source's, written by the parser.</text>

</svg>
